- id: QW-002
  title: Create Config Directory and Core Modules
  description: >
    Add a modular configuration directory (config/) to manage global
    app settings, logging, and debug tools cleanly.
  status: planning
  priority: medium
  owner: Brandon
  related_files:
    - config/logger.py
    - config/debug.py
    - config/settings.py
  subtasks:
    - Create config/logger.py for centralized logging setup.
    - Create config/debug.py with global DEBUG_MODE flag and helper.
    - Create config/settings.py for shared constants (paths, defaults).
  notes: |
    All modules should import from config/ instead of defining local constants.
    Example usage:
      from config.logger import log
      from config.settings import DB_PATH
      from config.debug import debug_print
  timeline: short_term

